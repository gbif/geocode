spring:
  datasource:
    url: @geocode-ws.db.url@
    username: @geocode-ws.db.username@
    password: @geocode-ws.db.password@
    hikari:
      connectionTimeout: 30000
      idleTimeout: 600000
      maximumPoolSize: 12
      minimumIdle: 2
  liquibase:
    enabled: false
  shapefiles:
    root: @geocode-ws.shapefiles.path@
    enabled: PoliticalLayer, ContinentLayer, MrLayer, GadmLayer, WgsrpdLayer
  defaultLayers: Political, Continent, Centroids, MR, GADM, WGSRPD
  config:
    import: "optional:zookeeper:"
  cloud:
    zookeeper:
      enabled: false
      discovery:
        enabled: false
      config:
        enabled: false

  jmx:
    enabled: true
